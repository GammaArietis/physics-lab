name: s1_c3_coupling_norm

geometry:
  type: circle
  radius: 1.0

dynamics:
  type: laplacian

spectrum:
  n_max: 5

options:
  include_c3: true

parameters:
  R:
    value: 1.0
    provenance: INPUT
  hbar:
    value: 1.0
    provenance: INPUT
  g:
    value: 1.0
    provenance: INPUT
    description: Bare coupling in D_mu. Not a charge.
  Z_A:
    value: 2.0
    provenance: INPUT
    description: Gauge kinetic coefficient. Not assumed equal to 1.
  C:
    value: 1.0
    provenance: INPUT

observables:
  - mass
